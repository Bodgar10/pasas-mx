<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
/* Story del día (1080×1920). Zonas seguras: nada importante arriba de y=260 ni debajo de y=1640.
   Deja libre la zona de abajo (y 1420–1600) para el sticker de enlace, que pone Bodgar en Instagram. */
.s-marca{position:absolute;left:90px;top:290px;font-family:M;font-weight:600;font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,241,234,.7)}
.s-marca b{color:var(--terra)}
.s-chip{position:absolute;left:90px;top:370px;display:inline-flex;align-items:center;gap:14px;background:var(--terra);color:#fff;border-radius:999px;padding:14px 26px;font-family:M;font-weight:600;font-size:28px;letter-spacing:.08em;text-transform:uppercase}
.s-tit{position:absolute;left:90px;right:90px;top:480px}
.s-tit h1{margin:0;font-family:B;font-weight:800;font-stretch:86%;font-size:128px;line-height:.98;letter-spacing:-.025em;text-wrap:balance}
.s-tit h1 em{font-style:normal;color:var(--terra)}
.s-dato{position:absolute;left:90px;right:90px;top:1010px;background:var(--papel);color:var(--tinta);border-radius:34px;padding:30px 36px;box-shadow:0 30px 70px rgba(0,0,0,.35);display:flex;align-items:center;gap:26px}
.s-dato b{font-family:B;font-weight:800;font-size:84px;line-height:1;white-space:nowrap}
.s-dato span{font-size:31px;font-weight:600;color:var(--gris);line-height:1.25}
.s-dato.perd b{color:var(--terra2)}.s-dato.gana b{color:var(--verde)}
.s-txt{position:absolute;left:90px;right:90px;top:1250px;font-size:46px;font-weight:600;line-height:1.3;color:rgba(244,241,234,.92);text-wrap:balance}
.s-ej{position:absolute;left:90px;right:90px;top:1612px;text-align:center;font-family:M;font-size:22px;color:rgba(244,241,234,.45)}
</style></head>
<body><div class="frame" id="frame">
  <div class="s-marca">bodgar<b>.</b>dev</div>
  <div class="s-chip" id="chip">Nuevo reel</div>
  <div class="s-tit"><h1 id="tit"></h1></div>
  <div class="s-dato" id="dato"><b id="dnum"></b><span id="dtxt"></span></div>
  <div class="s-txt" id="txt"></div>
  <div class="s-ej" id="ej">Cifras de ejemplo</div>
</div>
<script>
// data.story = {chip?, titulo?, texto}; si falta, usa data.portada
window.setup = function (data) {
  var s = data.story || {}, p = data.portada || {};
  var esc = function (x) { var d = document.createElement('div'); d.textContent = x; return d.innerHTML; };
  if (s.chip) document.getElementById('chip').textContent = s.chip;
  document.getElementById('tit').innerHTML = esc(s.titulo || p.titulo || '').replace(/\*(.+?)\*/g, '<em>$1</em>');
  document.getElementById('txt').textContent = s.texto || '';
  var dato = s.dato || p.dato, d = document.getElementById('dato');
  if (dato) { document.getElementById('dnum').textContent = dato.num; document.getElementById('dtxt').textContent = dato.texto; d.classList.add(dato.tipo || 'perd'); }
  else { d.style.display = 'none'; document.getElementById('ej').style.visibility = 'hidden'; document.getElementById('txt').style.top = '1060px'; }
  return 0;
};
</script>
</body></html>
