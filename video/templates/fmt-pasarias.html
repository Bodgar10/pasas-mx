<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="formatos.css">
<style>
.qhead{display:flex;flex-direction:column;gap:2.4cqw}
.score{display:flex;gap:2cqw}
.score i{width:9cqw;height:2cqw;border-radius:1cqw;background:var(--line)}
.score i.on{background:var(--brand)}
</style></head>
<body>
<div class="frame">
  <div class="scene center" id="hook">
    <span class="tag" id="h-tag">Examen de 2° de secundaria</span>
    <div class="big">¿TÚ LO<br><em>PASARÍAS?</em></div>
    <div class="sub">3 preguntas reales.<br>4 segundos cada una.</div>
  </div>
  <div id="qs"></div>
  <div class="scene center cta" id="end">
    <div class="h">¿Cuántas sacaste? Comenta.</div>
    <div class="paper"><span class="k">Para papás</span><span class="v">¿Tu hijo sí se las sabe? Que lo intente.</span></div>
    <div class="wordmark">PASAS<span>·</span>MX</div>
    <div class="url">pasas.mx</div>
  </div>
</div>
<script src="anim.js"></script>
<script>
var D, T;
window.setup = function (data) {
  D = data;
  $('h-tag').textContent = 'Examen de ' + data.grado;
  var H = 2.4, Q = 6.4;
  T = { hook: [0, H], q: data.preguntas.map(function (_, i) { return H + i * Q; }), Q: Q };
  T.end = [H + data.preguntas.length * Q, H + data.preguntas.length * Q + 3.6];
  $('qs').innerHTML = data.preguntas.map(function (p, i) {
    return '<div class="scene" id="q' + i + '">' +
      '<div class="meta"><div class="qhead"><span class="tag">Pregunta ' + (i + 1) + ' de ' + data.preguntas.length + ' · ' + esc(p.materia) + '</span>' +
      '<div class="score">' + data.preguntas.map(function (_, j) { return '<i class="' + (j <= i ? 'on' : '') + '"></i>'; }).join('') + '</div></div>' +
      '<div class="ring" id="r' + i + '">' + RING_SVG + '</div></div>' +
      '<div class="q">' + esc(p.pregunta) + '</div>' +
      '<div class="opts">' + p.opciones.map(function (o, j) {
        return '<div class="opt" id="o' + i + '_' + j + '"><span class="l">' + 'ABCD'[j] + '</span><span>' + esc(o) + '</span></div>';
      }).join('') + '</div></div>';
  }).join('');
  window.render(0);
  return T.end[1];
};
window.render = function (t) {
  show($('hook'), win(t, T.hook[0], T.hook[1], false, true));
  D.preguntas.forEach(function (p, i) {
    var s = T.q[i], el = $('q' + i);
    show(el, win(t, s, s + T.Q, true, true));
    p.opciones.forEach(function (_, j) {
      var o = $('o' + i + '_' + j);
      pop(o, t, s + 0.4 + j * 0.22, 0.28);
      var revealed = t >= s + 5.3;
      o.classList.toggle('right', revealed && j === p.correcta);
      if (revealed && j !== p.correcta) o.style.opacity = Math.max(0.3, 1 - clamp((t - s - 5.3) / 0.3) * 0.7);
    });
    var r = $('r' + i);
    ring(r, r.querySelector('.bar'), r.querySelector('b'), t, s + 1.3, s + 5.3);
  });
  show($('end'), win(t, T.end[0], T.end[1] + 1, true, false));
};
</script>
</body></html>
