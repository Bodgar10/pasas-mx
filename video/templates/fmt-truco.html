<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="formatos.css">
<style>
/* Estilo del grid de @pasas.mx: marco neón, títulos gruesos condensados, Pasita protagonista */
.frame{background:
  radial-gradient(90% 50% at 50% 100%, rgba(124,58,237,.55), transparent 70%),
  radial-gradient(80% 40% at 100% 0%, rgba(236,72,153,.25), transparent 60%), var(--bg)}
.neon{position:absolute;inset:2.4cqw;border-radius:5cqw;border:.7cqw solid var(--c,var(--cyan));z-index:8;pointer-events:none;
  box-shadow:0 0 2.4cqw var(--c,var(--cyan)), inset 0 0 2.4cqw var(--c,var(--cyan))}
.scene{padding:17cqw 9cqw 22cqw}
.t{font-family:var(--font-title);font-weight:400;text-transform:uppercase;line-height:.98;letter-spacing:.005em;text-wrap:balance;
  text-shadow:0 .6cqw 0 rgba(0,0,0,.35)}
.hook-t{font-size:15cqw}
.hook-t span{display:block}
.c1{color:#fff}.c2{color:var(--cyan)}.c3{color:var(--pink)}.c4{color:var(--xp)}
.pasita{position:absolute;left:50%;transform-origin:50% 100%}
.promise{font-size:24cqw;color:var(--pink);line-height:.9}
.promise-sub{font-size:6.4cqw;font-weight:900;text-wrap:balance}
.num{width:22cqw;height:22cqw;border-radius:50%;display:grid;place-items:center;font-family:var(--font-title);font-size:15cqw;
  color:var(--bg);background:var(--xp);box-shadow:0 0 3cqw rgba(251,191,36,.6)}
.tip-t{font-size:12cqw}
.tip-d{font-size:6.2cqw;font-weight:800;line-height:1.3;text-wrap:pretty;max-width:92%}
.dots{display:flex;gap:2cqw}
.dots i{width:9cqw;height:1.8cqw;border-radius:1cqw;background:var(--line)}
.dots i.on{background:var(--xp)}
.close-t{font-size:17cqw;color:var(--xp)}
.close-sub{font-size:6.4cqw;font-weight:900}
.brand{position:absolute;left:0;right:0;top:6cqw;text-align:center;font-family:var(--font-brand);font-weight:900;font-size:5.4cqw;letter-spacing:.14em;z-index:9}
.brand span{color:var(--pink)}
</style></head>
<body>
<div class="frame">
  <div class="neon" id="neon"></div>

  <div class="scene" id="s-hook">
    <div class="t hook-t" id="hook-t"></div>
  </div>
  <div class="pasita" id="p-hook"></div>

  <div class="scene" id="s-promise">
    <div class="t promise" id="promise-n"></div>
    <div class="promise-sub" id="promise-sub"></div>
  </div>
  <div class="pasita" id="p-promise"></div>

  <div id="tips"></div>
  <div class="pasita" id="p-tip"></div>

  <div class="scene" id="s-close">
    <div class="t close-t" id="close-t"></div>
    <div class="close-sub" id="close-sub"></div>
  </div>
  <div class="pasita" id="p-close"></div>

  <div class="brand">PASAS<span>.</span>MX</div>
</div>
<script src="anim.js"></script>
<script src="pasita.js"></script>
<script>
var D, T;
var COLORS = ['c1', 'c2', 'c1', 'c3'];
window.setup = function (data) {
  D = data;
  $('hook-t').innerHTML = data.gancho.map(function (l, i) { return '<span class="' + COLORS[i % 4] + '">' + esc(l) + '</span>'; }).join('');
  $('promise-n').textContent = data.trucos.length + ' trucos';
  $('promise-sub').textContent = data.promesa;
  $('tips').innerHTML = data.trucos.map(function (tr, i) {
    return '<div class="scene" id="s-tip' + i + '"><div class="num">' + (i + 1) + '</div>' +
      '<div class="t tip-t c1">' + esc(tr.titulo) + '</div><div class="tip-d">' + esc(tr.detalle) + '</div>' +
      '<div class="dots">' + data.trucos.map(function (_, j) { return '<i class="' + (j <= i ? 'on' : '') + '"></i>'; }).join('') + '</div></div>';
  }).join('');
  $('close-t').textContent = data.cierre.titulo;
  $('close-sub').textContent = data.cierre.sub;

  // Pasita en cada escena: pose, ancho (px) y dónde se para (bottom en px)
  buildPasita($('p-hook'), 'pensativa', 680);    place('p-hook', 680, 300);
  buildPasita($('p-promise'), 'celebrando', 640); place('p-promise', 640, 330);
  buildPasita($('p-tip'), 'aprobando', 520);      place('p-tip', 520, 330, 170);
  buildPasita($('p-close'), 'flexionando', 680);  place('p-close', 680, 330);

  var H = 3.2, P = 1.9, TIP = 4.6;
  T = { hook: [0, H], promise: [H, H + P], tips: data.trucos.map(function (_, i) { return H + P + i * TIP; }), TIP: TIP };
  T.close = [H + P + data.trucos.length * TIP, H + P + data.trucos.length * TIP + 4];
  window.ready = pasitaReady();
  window.render(0);
  return T.close[1];
};
function place(id, px, bottom, dx) {
  var el = $(id), h = px * PASITA_VB.h / PASITA_VB.w;
  el.style.top = (1920 - bottom - h) + 'px';
  el.style.marginLeft = (-px / 2 + (dx || 0)) + 'px';
  el.style.width = px + 'px';
}
// Brinco al entrar, respiración cuando está quieta
function body(el, t, t0, extra) {
  var j = clamp((t - t0) / 0.5), hop = Math.sin(j * Math.PI) * (1 - j) * 60;
  var breathe = 1 + 0.012 * Math.sin(t * 2.4);
  el.style.transform = 'translateY(' + (-hop) + 'px) scale(' + (1 / breathe) + ',' + breathe + ')' + (extra || '');
}
window.render = function (t) {
  show($('s-hook'), win(t, T.hook[0], T.hook[1], false, true));
  var ph = $('p-hook'); ph.style.opacity = win(t, T.hook[0], T.hook[1], false, true);
  // Pasita nerviosa: tiembla en el gancho
  body(ph, t, -1, ' translateX(' + (Math.sin(t * 40) * 6 * clamp(t / 0.3)) + 'px)');
  $('hook-t').querySelectorAll('span').forEach(function (s, i) { pop(s, t, 0.1 + i * 0.22, 0.3); });

  show($('s-promise'), win(t, T.promise[0], T.promise[1], true, true));
  var pp = $('p-promise'); pp.style.opacity = win(t, T.promise[0], T.promise[1], true, true); body(pp, t, T.promise[0]);
  $('promise-n').style.transform = 'scale(' + (0.7 + 0.3 * back(clamp((t - T.promise[0]) / 0.45))) + ')';

  var tipOn = 0;
  D.trucos.forEach(function (_, i) {
    var a = win(t, T.tips[i], T.tips[i] + T.TIP, true, true);
    show($('s-tip' + i), a); tipOn = Math.max(tipOn, a);
  });
  var tipStart = T.tips.reduce(function (acc, s) { return t >= s ? s : acc; }, T.tips[0]);
  var pt = $('p-tip'); pt.style.opacity = win(t, T.tips[0], T.close[0], true, true); body(pt, t, tipStart);

  show($('s-close'), win(t, T.close[0], T.close[1] + 1, true, false));
  var pc = $('p-close'); pc.style.opacity = win(t, T.close[0], T.close[1] + 1, true, false); body(pc, t, T.close[0]);
  var aura = pc.querySelector('[data-aura]'); if (aura) aura.style.transform = 'scale(' + (1 + 0.04 * Math.sin(t * 9)) + ')';

  // El marco cambia de color por escena, como los posts
  var c = t < T.promise[0] ? 'var(--cyan)' : (t < T.tips[0] ? 'var(--pink)' : (t < T.close[0] ? 'var(--cyan)' : 'var(--xp)'));
  $('neon').style.setProperty('--c', c);
  blinkAll(t);
};
</script>
</body></html>
