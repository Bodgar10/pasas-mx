<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
/* Anuncio del reto diario (20-25 s, 1080×1920) para papás: gancho → "¿Cuál sobra?" con
   4 opciones y el toque → por qué sobra → un reto nuevo cada día → pasas.mx/arcade.
   Misma familia visual que reel-ilustrado.html: fondos de OpenAI sin texto
   (video/arte/<anuncio>/reel-NN.jpg) y todo el texto exacto animado encima. */
.frame{background:#0f0a1e}
.bg{position:absolute;inset:-40px;background-size:cover;background-position:center;opacity:0;will-change:transform,opacity}
.bg.vacio{background:radial-gradient(80% 50% at 50% 45%, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%), radial-gradient(110% 60% at 0% 100%, rgba(124,58,237,.45), transparent 60%), #0f0a1e}
.top{position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg, rgba(15,10,30,.85) 0%, rgba(15,10,30,.6) 55%, rgba(15,10,30,0) 100%);pointer-events:none}
.dim{position:absolute;inset:0;background:rgba(15,10,30,.62);opacity:0}
.neon{position:absolute;inset:2.4cqw;border-radius:5cqw;border:.7cqw solid var(--c);z-index:20;pointer-events:none;box-shadow:0 0 2.4cqw var(--c), inset 0 0 2.4cqw var(--c)}
.brand{position:absolute;left:7cqw;top:6cqw;font-family:var(--font-brand);font-weight:900;font-size:4.4cqw;letter-spacing:.14em;z-index:9;text-shadow:0 .4cqw 1.6cqw rgba(0,0,0,.8)}
.brand span{color:var(--pink)}
.hob{position:absolute;right:7cqw;top:5.6cqw;font-size:3.6cqw;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--c);
  padding:1cqw 3cqw;border-radius:99px;z-index:9;box-shadow:0 0 3cqw var(--c)}
.bar{position:absolute;left:7cqw;right:7cqw;top:14.6cqw;height:.9cqw;border-radius:1cqw;background:rgba(255,255,255,.18);z-index:9;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c)}

.cap{position:absolute;left:7cqw;right:7cqw;top:20cqw;text-align:center;z-index:6;opacity:0}
.cap span{display:block;font-family:var(--font-title);font-weight:900;line-height:1.03;white-space:nowrap;
  -webkit-text-stroke:1.3cqw var(--bg);paint-order:stroke fill;text-shadow:0 1cqw 0 rgba(0,0,0,.55);font-size:10.5cqw;color:#fff}
.cap span.k{color:var(--c);font-size:14cqw}
.cap span.s{font-size:9cqw}

/* Opciones del reto: 4 botones como en pasas.mx/arcade */
.ops{position:absolute;left:9cqw;right:9cqw;top:640px;z-index:6;display:flex;flex-direction:column;gap:3cqw;opacity:0}
.op{position:relative;display:flex;align-items:center;gap:3.4cqw;background:rgba(15,10,30,.9);border:.5cqw solid rgba(255,255,255,.35);border-radius:4.4cqw;
  padding:3.6cqw 4.4cqw;font-size:6.8cqw;font-weight:900;color:#fff;opacity:0;box-shadow:0 1.4cqw 4cqw rgba(0,0,0,.5);white-space:nowrap}
.op i{flex:none;width:9cqw;height:9cqw;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:5cqw;background:rgba(255,255,255,.14);color:#fff}
.op.sobra{border-color:var(--pink);background:color-mix(in srgb, var(--pink) 26%, rgba(15,10,30,.92));box-shadow:0 0 5cqw var(--pink)}
.op.sobra i{background:var(--pink)}
.op .badge{position:absolute;right:4cqw;top:-3.6cqw;transform:scale(.6);font-size:4.4cqw;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  color:#fff;background:var(--pink);padding:1cqw 2.6cqw;border-radius:99px;opacity:0}
.tap{position:absolute;width:15cqw;height:15cqw;margin:-7.5cqw 0 0 -7.5cqw;border-radius:50%;border:1cqw solid #fff;z-index:8;opacity:0;pointer-events:none;box-shadow:0 0 3cqw rgba(255,255,255,.7)}
.ring{position:absolute;left:50%;top:1520px;width:170px;height:170px;margin-left:-85px;z-index:6;opacity:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-brand);font-size:10cqw;color:var(--c);text-shadow:0 0 3cqw var(--c)}
.ring .disc{position:absolute;inset:12px;border-radius:50%;background:rgba(15,10,30,.8)}

/* Explicación */
.exp{position:absolute;left:8cqw;right:8cqw;top:520px;z-index:6;opacity:0;background:rgba(15,10,30,.9);border:.6cqw solid var(--c);border-radius:5cqw;
  padding:6cqw 6cqw;font-size:6.6cqw;font-weight:800;line-height:1.3;text-align:center;color:#fff;box-shadow:0 0 5cqw rgba(0,0,0,.6)}
.exp b{color:var(--c);font-weight:900}

/* Materias */
.mats{position:absolute;left:6cqw;right:6cqw;top:540px;z-index:6;display:flex;flex-wrap:wrap;justify-content:center;gap:3cqw}
.mat{font-size:6.4cqw;font-weight:900;color:var(--bg);padding:2.4cqw 5cqw;border-radius:99px;opacity:0;white-space:nowrap;box-shadow:0 0 3cqw rgba(0,0,0,.4)}
.mats-sub{position:absolute;left:0;right:0;top:900px;z-index:6;text-align:center;font-size:5.8cqw;font-weight:900;color:#fff;opacity:0;text-shadow:0 .4cqw 1.6cqw rgba(0,0,0,.95)}

/* Cierre */
.cta{position:absolute;left:7cqw;right:7cqw;top:520px;z-index:7;opacity:0;display:flex;flex-direction:column;align-items:center;gap:4.4cqw}
.cta .card{background:rgba(15,10,30,.9);border:.6cqw solid var(--c);border-radius:5cqw;padding:5cqw 6cqw;display:flex;flex-direction:column;gap:2cqw;text-align:center;box-shadow:0 0 5cqw rgba(0,0,0,.6)}
.cta .card b{font-size:7.6cqw;font-weight:900;line-height:1.2;color:#fff}
.cta .card b b{color:var(--c)}
.cta .card span{font-size:5.6cqw;font-weight:800;color:var(--c)}
.cta .url{font-family:var(--font-brand);font-weight:700;font-size:6.4cqw;background:var(--brand);color:#fff;padding:3cqw 6.4cqw;border-radius:4cqw;box-shadow:0 0 5cqw rgba(124,58,237,.8);white-space:nowrap}
</style></head>
<body>
<div class="frame" id="frame">
  <div id="bgs"></div>
  <div class="dim" id="dim"></div>
  <div class="top"></div>
  <div class="neon"></div>
  <div class="brand">PASAS<span>.</span>MX</div>
  <div class="hob" id="hob"></div>
  <div class="bar"><i id="bar"></i></div>
  <div id="scenes"></div>
  <div class="tap" id="tap"></div>
</div>
<script src="anim.js"></script>
<script>
var D, E, T0, TOTAL;
var COLOR_MATERIA = { 'Historia': '#a78bfa', 'Biología': '#2dd4bf', 'Geografía': '#38bdf8', 'Química y Física': '#fbbf24', 'Español': '#f472b6' };
function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function capHTML(lines) {
  return (lines || []).map(function (l) { var t = typeof l === 'string' ? l : l[0], k = typeof l === 'string' ? '' : l[1]; return '<span class="' + k + '">' + esc(t) + '</span>'; }).join('');
}
// Momentos de la escena de opciones (relativos a su inicio)
function tiemposOpciones(e) {
  var d = e.dur || 6.4;
  return { chips: 0.45, paso: 0.22, ring0: 1.5, toque: d - 2.0, revela: d - 1.75 };
}

window.setup = function (data) {
  D = data; E = data.reel.escenas;
  var fr = $('frame'); fr.style.setProperty('--c', data.color || '#fbbf24');
  $('hob').textContent = data.etiqueta || 'Reto diario';
  T0 = []; var t = 0; E.forEach(function (e) { T0.push(t); t += e.dur || 3.5; }); TOTAL = t;
  $('bgs').innerHTML = E.map(function (e, i) {
    var src = (data.reel_fondos || [])[e.fondo_de != null ? e.fondo_de : i];
    return '<div class="bg' + (src ? '' : ' vacio') + '" id="bg' + i + '"' + (src ? ' style="background-image:url(\'' + src + '\')"' : '') + '></div>';
  }).join('');
  $('scenes').innerHTML = E.map(function (e, i) {
    var h = '<div class="cap" id="cap' + i + '">' + capHTML(e.lineas) + '</div>';
    if (e.tipo === 'opciones') {
      h += '<div class="ops" id="ops' + i + '">' + e.opciones.map(function (o, k) {
        return '<div class="op" id="op' + i + '_' + k + '"><i>' + 'ABCD'[k] + '</i><span>' + esc(o) + '</span>' + (k === e.sobra ? '<em class="badge" id="ob' + i + '">Sobra</em>' : '') + '</div>';
      }).join('') + '</div>';
      h += '<div class="ring" id="ring' + i + '"><div class="disc"></div><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="3.4"/><circle id="rb' + i + '" cx="20" cy="20" r="17" fill="none" stroke="var(--c)" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="106.8" stroke-dashoffset="0"/></svg><b id="rn' + i + '">3</b></div>';
    }
    if (e.tipo === 'explica') h += '<div class="exp" id="exp' + i + '">' + md(e.texto) + '</div>';
    if (e.tipo === 'materias') {
      h += '<div class="mats">' + e.materias.map(function (m, k) { return '<div class="mat" id="mt' + i + '_' + k + '" style="background:' + (COLOR_MATERIA[m] || '#fbbf24') + '">' + esc(m) + '</div>'; }).join('') + '</div>';
      if (e.sub) h += '<div class="mats-sub" id="ms' + i + '">' + esc(e.sub) + '</div>';
    }
    if (e.tipo === 'cta') h += '<div class="cta" id="cta' + i + '"><div class="card"><b>' + md(e.cta.linea) + '</b>' + (e.cta.sub ? '<span>' + esc(e.cta.sub) + '</span>' : '') + '</div><div class="url">' + esc(e.url || 'pasas.mx') + '</div></div>';
    return h;
  }).join('');
  document.querySelectorAll('.cap span').forEach(function (s) { fitLines([s], 1080 - 2 * 76); });
  document.querySelectorAll('.op span').forEach(function (s) { fitLines([s], 1080 - 2 * 97 - 260); });
  window.ready = Promise.all([].map.call(document.querySelectorAll('.bg:not(.vacio)'), function (el) {
    return new Promise(function (ok) { var im = new Image(); im.onload = im.onerror = ok; im.src = el.style.backgroundImage.slice(5, -2); });
  }));
  window.render(0);
  return TOTAL;
};

// PNG de revisión: cada escena ya armada; la de opciones, antes y después del toque.
window.momentos = function () {
  var m = [];
  E.forEach(function (e, i) {
    var d = e.dur || 3.5;
    if (e.tipo === 'opciones') { var o = tiemposOpciones(e); m.push(T0[i] + o.ring0 + 0.4); m.push(T0[i] + d - 0.5); }
    else m.push(T0[i] + Math.min(d - 0.3, 2.2));
  });
  return m;
};

window.render = function (t) {
  var on = 0; for (var i = 0; i < E.length; i++) if (t >= T0[i]) on = i;
  $('bar').style.width = (100 * clamp(t / TOTAL)) + '%';
  $('tap').style.opacity = 0;
  E.forEach(function (e, i) {
    var a = T0[i], d = e.dur || 3.5, b = a + d, last = i === E.length - 1;
    var bg = $('bg' + i), vis = clamp((t - a + 0.35) / 0.35) * (last ? 1 : clamp((b + 0.35 - t) / 0.35));
    if (t < a - 0.35 || t > b + 0.35) vis = 0;
    bg.style.opacity = vis;
    var p = clamp((t - a) / d), z = 1.1 - 0.08 * p, dx = (i % 2 ? -1 : 1) * 20 * (p - 0.5);
    bg.style.transform = 'translate(' + dx + 'px,' + (-10 * p) + 'px) scale(' + z + ')';
    var c = $('cap' + i), w = win(t, a, b, i > 0, !last);
    c.style.opacity = w;
    c.querySelectorAll('span').forEach(function (s, k) { var q = clamp((t - a - 0.05 - k * 0.2) / 0.28); s.style.opacity = q; s.style.transform = 'scale(' + (0.85 + 0.15 * back(q)) + ')'; });

    if (e.tipo === 'opciones') {
      var o = tiemposOpciones(e), ops = $('ops' + i);
      ops.style.opacity = w;
      var revelado = clamp((t - a - o.revela) / 0.3);
      e.opciones.forEach(function (_, k) {
        var el = $('op' + i + '_' + k), q = clamp((t - a - o.chips - k * o.paso) / 0.3);
        el.style.opacity = k === e.sobra ? q : q * (1 - 0.5 * revelado);
        var s = 0.86 + 0.14 * back(q);
        if (k === e.sobra && t - a >= o.toque) { var pr = clamp((t - a - o.toque) / 0.25); s *= 1 - 0.05 * Math.sin(Math.PI * pr); }
        el.style.transform = 'scale(' + s + ')';
        el.classList.toggle('sobra', k === e.sobra && revelado > 0);
      });
      var bd = $('ob' + i); bd.style.opacity = revelado; bd.style.transform = 'scale(' + (0.6 + 0.4 * back(revelado)) + ')';
      // Cuenta regresiva para pensar: de ring0 al toque
      var r = $('ring' + i), span = o.toque - o.ring0, left = Math.max(0, a + o.toque - t);
      r.style.opacity = t - a >= o.ring0 && t - a < o.toque + 0.2 ? w * clamp((t - a - o.ring0) / 0.25) : 0;
      $('rn' + i).textContent = Math.max(1, Math.ceil(left * 3 / span));
      $('rb' + i).setAttribute('stroke-dashoffset', (106.8 * (1 - clamp(left / span))).toFixed(1));
      // El toque: un círculo que aparece sobre la opción que sobra y se expande
      if (t - a >= o.toque - 0.25 && t - a < o.toque + 0.5) {
        var el2 = $('op' + i + '_' + e.sobra).getBoundingClientRect(), fb = $('frame').getBoundingClientRect();
        var tp = $('tap'), qq = clamp((t - a - o.toque + 0.25) / 0.75);
        tp.style.left = (el2.left - fb.left + el2.width * 0.72) + 'px'; tp.style.top = (el2.top - fb.top + el2.height * 0.55) + 'px';
        tp.style.opacity = qq < 0.35 ? qq / 0.35 : (1 - (qq - 0.35) / 0.65);
        tp.style.transform = 'scale(' + (qq < 0.35 ? 1 - 0.25 * (qq / 0.35) : 0.75 + 0.9 * (qq - 0.35)) + ')';
      }
    }
    if (e.tipo === 'explica') show($('exp' + i), clamp((t - a - 0.55) / 0.4) * w);
    if (e.tipo === 'materias') {
      e.materias.forEach(function (_, k) { pop($('mt' + i + '_' + k), t, a + 0.5 + k * 0.22, 0.3); $('mt' + i + '_' + k).style.opacity *= w; });
      if (e.sub) show($('ms' + i), clamp((t - a - 0.5 - e.materias.length * 0.22) / 0.4) * w);
    }
    if (e.tipo === 'cta') show($('cta' + i), clamp((t - a - 0.5) / 0.4));
  });
  var ef = E[on], tt = t - T0[on];
  $('dim').style.opacity = ef.tipo === 'opciones' ? 0.55 * clamp((tt - 0.2) / 0.4)
    : ef.tipo === 'explica' || ef.tipo === 'materias' ? 0.4 * clamp((tt - 0.3) / 0.4)
    : ef.tipo === 'cta' ? 0.35 : 0;
};
</script>
</body></html>
