<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
/* Carrusel de "regalo" (1080×1350, 4:5): un tema real de PASAS en láminas para
   guardar y compartir. Una lámina por render: window.setup(data, i). */
.frame{height:1350px;background:radial-gradient(90% 50% at 100% 0%, rgba(236,72,153,.22), transparent 60%), radial-gradient(90% 55% at 0% 100%, rgba(124,58,237,.42), transparent 60%), #0f0a1e}
.stars i{position:absolute;border-radius:50%;background:#fff}
.neon{position:absolute;inset:2.4cqw;border-radius:5cqw;border:.6cqw solid var(--c);box-shadow:0 0 2.2cqw var(--c), inset 0 0 2.2cqw var(--c);pointer-events:none}
.top{position:absolute;left:8cqw;right:8cqw;top:7cqw;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:var(--font-brand);font-weight:900;font-size:3.6cqw;letter-spacing:.14em}
.brand span{color:var(--pink)}
.num{font-family:var(--font-brand);font-weight:700;font-size:3.2cqw;color:var(--muted)}
.body{position:absolute;left:8cqw;right:8cqw;top:15cqw;bottom:9cqw;display:flex;flex-direction:column;gap:3.4cqw}
.tag{align-self:flex-start;font-family:var(--font-title);font-weight:900;font-size:3.6cqw;letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:var(--c);padding:1cqw 3cqw 1.2cqw;border-radius:2.2cqw;box-shadow:0 0 2.6cqw var(--c)}
.t{font-family:var(--font-title);font-weight:900;text-transform:uppercase;line-height:1.02;-webkit-text-stroke:1cqw var(--bg);paint-order:stroke fill;text-shadow:0 .7cqw 0 rgba(0,0,0,.45)}
.t span{display:block;white-space:nowrap;font-size:9.6cqw}
.t span:nth-child(2){color:var(--c)}
.p{font-size:4.8cqw;font-weight:800;line-height:1.35;text-wrap:pretty}
.p b{color:var(--xp);font-weight:900}
.box{background:rgba(26,16,53,.92);border:.4cqw solid var(--line);border-radius:4cqw;padding:4cqw 4.4cqw}
.f{font-family:var(--font-title);font-weight:900;font-size:8.4cqw;text-align:center;color:#fff;white-space:nowrap}
.f.small{font-size:6.4cqw}
.fig{display:flex;justify-content:center}
.foot{font-size:4.2cqw;font-weight:800;color:var(--muted);text-align:center}
.foot b{color:var(--fg)}
.row{display:flex;gap:3cqw;align-items:center}
.pasita{position:absolute}
/* Reglas */
.regla{display:flex;flex-direction:column;gap:1.4cqw}
.regla .si{font-size:5cqw;font-weight:800}
.regla .haz{display:flex;align-items:center;gap:3cqw}
.regla .haz b{font-family:var(--font-title);font-weight:900;font-size:5cqw;color:var(--bg);background:var(--k);padding:.8cqw 2.6cqw;border-radius:2cqw}
.regla .haz span{font-family:var(--font-title);font-weight:900;font-size:7cqw;color:var(--k);white-space:nowrap}
/* Ejemplo */
.pasos{display:flex;flex-direction:column;gap:2cqw}
.pasos div{display:flex;gap:3cqw;align-items:center;font-family:var(--font-title);font-weight:900;font-size:6.4cqw}
.pasos i{font-style:normal;flex:none;width:7.4cqw;height:7.4cqw;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--font-title);font-weight:900;font-size:4cqw}
.pasos b{color:var(--xp)}
/* Lista */
.items{display:grid;grid-template-columns:1fr 1fr;gap:3cqw}
.items div{background:rgba(26,16,53,.92);border:.4cqw solid var(--c);border-radius:4cqw;padding:3.4cqw 2cqw;text-align:center;font-family:var(--font-title);font-weight:900;font-size:7.4cqw;color:#fff;white-space:nowrap}
/* Temáticas */
.tarj{display:flex;flex-direction:column;gap:3cqw}
.tarj .box{display:flex;gap:3.4cqw;align-items:flex-start;padding:3.4cqw 4cqw}
.tarj .ic{flex:none;width:13cqw;height:13cqw;border-radius:3.4cqw;background:#2d1b69;display:grid;place-items:center;font-size:7cqw}
.tarj .tn{font-size:3.8cqw;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--c);margin-bottom:1cqw}
.tarj .tx{font-size:4.2cqw;font-weight:800;line-height:1.38}
.tarj .tx b{color:var(--xp)}
/* Reto */
.opts{display:flex;flex-direction:column;gap:2.6cqw}
.opts div{display:flex;align-items:center;gap:3.4cqw;background:rgba(26,16,53,.92);border:.4cqw solid var(--line);border-radius:4cqw;padding:2.6cqw 4cqw;font-size:6cqw;font-weight:900}
.opts i{font-style:normal;flex:none;width:9cqw;height:9cqw;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:4.6cqw;color:#fff}
/* Con hobby: portada, escena y mapa */
.hob{display:flex;flex-direction:column;gap:1cqw}
.hob small{font-size:5cqw;font-weight:800;color:var(--fg)}
.hob b{font-family:var(--font-title);font-weight:900;font-size:12cqw;line-height:1;text-transform:uppercase;color:var(--c);white-space:nowrap;
  -webkit-text-stroke:1.1cqw var(--bg);paint-order:stroke fill;text-shadow:0 0 4cqw var(--c)}
.hob em{font-style:normal;font-size:4.4cqw;font-weight:800;color:var(--muted)}
.svgbox{background:rgba(26,16,53,.92);border:.4cqw solid var(--line);border-radius:4cqw;padding:3cqw;display:flex;justify-content:center}
.svgbox svg{width:100%;height:auto;max-height:520px}
.svgbox.fill svg{width:auto;height:100%;max-height:none;max-width:100%}
.mapa{display:flex;flex-direction:column;gap:2.4cqw}
.mapa div{display:grid;grid-template-columns:1fr 7cqw 1fr;align-items:center;gap:1.4cqw}
.mapa .l{background:rgba(26,16,53,.92);border:.4cqw solid var(--c);border-radius:3.4cqw;padding:2.6cqw 3cqw;font-size:4.4cqw;font-weight:900;color:var(--c);line-height:1.25}
.mapa .r{background:rgba(251,191,36,.12);border:.4cqw solid rgba(251,191,36,.5);border-radius:3.4cqw;padding:2.6cqw 3cqw;font-size:4.4cqw;font-weight:900;color:var(--xp);line-height:1.25}
.mapa i{font-style:normal;text-align:center;font-size:6cqw;font-weight:900;color:var(--fg)}
/* Chuleta: la última lámina, la que vale la pena guardar */
.chu-f{background:rgba(26,16,53,.92);border:.4cqw solid var(--line);border-radius:4cqw;padding:2.6cqw 3cqw;text-align:center;font-family:var(--font-title);font-weight:900;font-size:7.6cqw;color:#fff;white-space:nowrap}
.chu{display:flex;flex-direction:column;gap:2.2cqw}
.chu > div{display:grid;grid-template-columns:8cqw 1fr;gap:2.4cqw;align-items:start}
.chu i{font-style:normal;width:8cqw;height:8cqw;border-radius:50%;background:var(--c);color:var(--bg);display:grid;place-items:center;font-family:var(--font-title);font-weight:900;font-size:4.6cqw}
.chu .st{font-size:4.6cqw;font-weight:900;line-height:1.3}
.chu .st b{color:var(--xp)}
.chu .fm{display:block;margin-top:.6cqw;font-family:var(--font-title);font-weight:900;font-size:5.4cqw;color:var(--xp)}
.recuerdo{display:flex;gap:3cqw;align-items:center;border:.4cqw solid var(--c);background:color-mix(in srgb, var(--c) 14%, transparent);border-radius:4cqw;padding:2.6cqw 3.4cqw;font-size:4.4cqw;font-weight:800;line-height:1.35}
.recuerdo span:first-child{font-size:7cqw;flex:none}
.recuerdo b{color:var(--c)}
.chu-foot{margin-top:auto;display:flex;flex-direction:column;gap:1.2cqw;font-size:4cqw;font-weight:800;color:var(--muted)}
.chu-foot b{color:var(--fg)}
.chu-save{font-family:var(--font-title);font-weight:900;font-size:4.8cqw;color:#fff}
/* Cierre */
.resp{display:flex;align-items:baseline;gap:3cqw}
.resp b{font-family:var(--font-title);font-weight:900;font-size:16cqw;line-height:1;color:var(--ok);text-shadow:0 0 3cqw rgba(16,185,129,.5)}
.cta{background:var(--brand);border-radius:4cqw;padding:4cqw 4.4cqw;font-size:5cqw;font-weight:800;line-height:1.35;box-shadow:0 0 4cqw rgba(124,58,237,.6)}
.cta b{font-family:var(--font-brand);font-weight:900}
/* Con ilustración de OpenAI: la escena de fondo y el texto exacto encima */
.arte{position:absolute;inset:0;background-size:cover;background-position:center}
.velo{position:absolute;inset:0;pointer-events:none}
/* Sin velo uniforme: solo se protege la zona del texto (zona_texto de cada lámina) y la franja del logo */
.velo::before{content:"";position:absolute;left:0;right:0;top:0;height:16%;background:linear-gradient(180deg, rgba(15,10,30,.75), rgba(15,10,30,0))}
.velo::after{content:"";position:absolute;inset:0}
.z-arriba .velo::after{background:linear-gradient(180deg, rgba(15,10,30,.82) 0%, rgba(15,10,30,.62) 30%, rgba(15,10,30,0) 52%)}
.z-arriba-grande .velo::after{background:linear-gradient(180deg, rgba(15,10,30,.84) 0%, rgba(15,10,30,.6) 55%, rgba(15,10,30,0) 76%)}
.z-abajo .velo::after{background:linear-gradient(0deg, rgba(15,10,30,.85) 0%, rgba(15,10,30,.6) 30%, rgba(15,10,30,0) 50%)}
.z-izquierda .velo::after{background:linear-gradient(90deg, rgba(15,10,30,.85) 0%, rgba(15,10,30,.62) 42%, rgba(15,10,30,0) 64%)}
.z-derecha .velo::after{background:linear-gradient(270deg, rgba(15,10,30,.85) 0%, rgba(15,10,30,.62) 42%, rgba(15,10,30,0) 64%)}
/* La caja de texto se acomoda a la zona que la ilustración dejó libre */
.z-arriba .body{bottom:46%}
.z-arriba-grande .body{bottom:24%}
.z-abajo .body{top:58%}
.z-izquierda .body{right:42%}
.z-derecha .body{left:42%}
.frame.denso .box, .frame.denso .opts div, .frame.denso .mapa .l, .frame.denso .chu-f, .frame.denso .regla{background:rgba(15,10,30,.86);backdrop-filter:blur(3px)}
.frame.denso .recuerdo{background:rgba(40,22,10,.9);backdrop-filter:blur(3px)}
.frame.denso .chu-foot{background:rgba(15,10,30,.82);border-radius:3cqw;padding:2cqw 3cqw;margin-left:-3cqw;margin-right:-3cqw}
.frame.denso .mapa .r{background:rgba(40,28,8,.88);backdrop-filter:blur(3px)}
.frame.con-arte .p, .frame.con-arte .foot, .frame.con-arte .hob small, .frame.con-arte .hob em{text-shadow:0 .3cqw 1.2cqw rgba(0,0,0,.95), 0 0 .4cqw rgba(0,0,0,.9)}
.frame.con-arte .stars{display:none}
</style></head>
<body>
<div class="frame" id="frame">
  <div class="arte" id="arte" hidden></div><div class="velo" id="velo" hidden></div>
  <div class="stars" id="stars"></div>
  <div class="neon"></div>
  <div class="top"><div class="brand">PASAS<span>.</span>MX</div><div class="num" id="num"></div></div>
  <div class="body" id="body"></div>
  <div class="pasita" id="pasita"></div>
</div>
<script src="anim.js"></script>
<script src="pasita.js"></script>
<script>
var COLORES = ['#7c3aed', '#ec4899', '#06b6d4', '#fbbf24', '#10b981'];
// Negritas con **…** y sin cortar "24 m" o "8 cm" entre dos renglones
function md(s) { return esc(s).replace(/(\d) (cm|m|km|kg|g|s|°|%)(?![a-záéíóúñ])/gi, '$1\u00a0$2').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function titulo(l) { return '<div class="t" id="tt">' + l.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div>'; }
function triangulo(w) {
  // Triángulo rectángulo con catetos a, b y la hipotenusa c resaltada
  return '<svg viewBox="0 0 420 300" width="' + w + '" style="overflow:visible">' +
    '<path d="M60 250 L360 250 L60 40 Z" style="fill:rgba(124,58,237,.18);stroke:#a78bfa;stroke-width:8;stroke-linejoin:round"/>' +
    '<path d="M60 40 L360 250" style="stroke:#fbbf24;stroke-width:10;stroke-linecap:round"/>' +
    '<path d="M60 210 h40 v40" style="fill:none;stroke:#ec4899;stroke-width:6"/>' +
    '<text x="22" y="160" style="font:900 46px Nunito;fill:#e2d9f3">a</text>' +
    '<text x="200" y="298" style="font:900 46px Nunito;fill:#e2d9f3">b</text>' +
    '<text x="226" y="128" style="font:900 50px Nunito;fill:#fbbf24">c</text></svg>';
}
window.setup = function (data, i) {
  var s = data.slides[i], c = data.hobby ? data.hobby.color : COLORES[i % COLORES.length], fr = $('frame');
  fr.style.setProperty('--c', c);
  // Ilustración de fondo (OpenAI): reemplaza el dibujo vectorial y la Pasita vectorial de esa lámina
  var conArte = !!s.fondo_img;
  $('arte').hidden = $('velo').hidden = !conArte;
  fr.classList.toggle('con-arte', conArte);
  fr.classList.toggle('denso', conArte && ['portada', 'escena'].indexOf(s.tipo) < 0);
  ['arriba', 'arriba-grande', 'abajo', 'izquierda', 'derecha'].forEach(function (z) { fr.classList.remove('z-' + z); });
  if (conArte) fr.classList.add('z-' + ((s.arte && s.arte.zona_texto) || 'arriba'));
  if (conArte) {
    $('arte').style.backgroundImage = 'url("' + s.fondo_img + '")';
    s = Object.assign({}, s, { svg: s.svg_con_arte ? s.svg : null });
  }
  var st = '';
  for (var k = 0; k < 60; k++) st += '<i style="left:' + ((k * 173 + i * 61) % 1080) + 'px;top:' + ((k * 389 + i * 97) % 1350) + 'px;width:' + (1 + k % 3) + 'px;height:' + (1 + k % 3) + 'px;opacity:' + (0.15 + (k % 5) * 0.1) + '"></i>';
  $('stars').innerHTML = st;
  $('num').textContent = (i + 1) + '/' + data.slides.length;
  var h = '', pose = null, pw = 0, px = 0, py = 0;
  if (s.tipo === 'portada' && data.hobby) {
    h = '<span class="tag">' + esc(data.materia + ' · ' + data.nivel) + '</span>' + titulo(s.titulo) +
      '<div class="hob"><small>explicado con</small><b id="hobn">' + data.hobby.icono + ' ' + esc(data.hobby.nombre) + '</b>' + (data.hobby.detalle ? '<em>' + esc(data.hobby.detalle) + '</em>' : '') + '</div>' +
      (s.svg ? '<div class="svgbox fill" style="flex:1;min-height:0">' + s.svg + '</div>' : '');
  } else if (s.tipo === 'escena') {
    h = '<span class="tag">' + esc(s.etiqueta) + '</span>' + titulo(s.titulo) + (s.texto ? '<div class="p">' + md(s.texto) + '</div>' : '') +
      (s.svg ? '<div class="svgbox">' + s.svg + '</div>' : '') + (s.nota ? '<div class="p" style="font-size:4.6cqw;color:var(--muted)">' + md(s.nota) + '</div>' : '');
  } else if (s.tipo === 'mapa') {
    h = '<span class="tag">' + esc(s.etiqueta) + '</span>' + titulo(s.titulo) +
      '<div class="mapa">' + s.pares.map(function (x) { return '<div><span class="l">' + md(x[0]) + '</span><i>→</i><span class="r">' + md(x[1]) + '</span></div>'; }).join('') + '</div>' +
      (s.formula ? '<div class="box"><div class="f">' + esc(s.formula) + '</div></div>' : '') + (s.nota ? '<div class="p" style="font-size:4.6cqw;color:var(--muted)">' + md(s.nota) + '</div>' : '');
  } else if (s.tipo === 'portada') {
    h = '<span class="tag">' + esc(data.materia + ' · ' + data.nivel) + '</span>' + titulo(s.titulo) +
      '<div class="p" style="color:var(--fg)">' + md(s.sub) + '</div>' +
      '<div class="box" style="display:flex;align-items:center;gap:4cqw;justify-content:space-between"><div class="f" style="font-size:8.6cqw;text-align:left">' + esc(s.formula) + '</div><div style="width:36cqw">' + triangulo('100%') + '</div></div>';
    pose = 'pensativa'; pw = 300; px = 700; py = 1290;
  } else if (s.tipo === 'idea') {
    h = '<span class="tag">' + esc(s.etiqueta) + '</span>' + titulo(s.titulo) + '<div class="p">' + md(s.texto) + '</div>' +
      '<div class="box"><div class="fig">' + triangulo('46%') + '</div><div class="f" style="margin-top:2cqw">' + esc(s.formula) + '</div></div>';
  } else if (s.tipo === 'reglas') {
    h = '<span class="tag">' + esc(s.etiqueta) + '</span>' + titulo(s.titulo) +
      s.reglas.map(function (r, j) {
        var k = j ? '#ec4899' : '#10b981';
        return '<div class="box regla" style="--k:' + k + ';border-color:' + k + '"><div class="si">' + esc(r.si) + '</div><div class="haz"><b>' + esc(r.haz) + '</b><span>' + esc(r.formula) + '</span></div></div>';
      }).join('') + '<div class="p" style="font-size:4.6cqw;color:var(--muted)">' + md(s.nota) + '</div>';
  } else if (s.tipo === 'ejemplo') {
    h = '<span class="tag">' + esc(s.etiqueta) + '</span>' + titulo(s.titulo) + '<div class="p">' + md(s.problema) + '</div>' +
      '<div class="box pasos">' + s.pasos.map(function (p, j) { return '<div><i>' + (j + 1) + '</i><span>' + md(p) + '</span></div>'; }).join('') + '</div>';
  } else if (s.tipo === 'lista') {
    h = '<span class="tag">' + esc(s.etiqueta) + '</span>' + titulo(s.titulo) + '<div class="p">' + md(s.texto) + '</div>' +
      '<div class="items">' + s.items.map(function (x) { return '<div>' + esc(x) + '</div>'; }).join('') + '</div>' +
      '<div class="p" style="font-size:4.6cqw;color:var(--muted)">' + md(s.nota) + '</div>';
  } else if (s.tipo === 'tematicas') {
    h = '<span class="tag">' + esc(s.etiqueta) + '</span>' + titulo(s.titulo) +
      '<div class="tarj">' + s.tarjetas.map(function (x) { return '<div class="box"><div class="ic">' + x.icono + '</div><div><div class="tn">' + esc(x.tema) + '</div><div class="tx">' + md(x.texto) + '</div></div></div>'; }).join('') + '</div>' +
      '<div class="foot">Cada alumno elige su temática: <b>anime, videojuegos, K-pop o fútbol</b></div>';
  } else if (s.tipo === 'reto') {
    h = '<span class="tag">' + esc(s.etiqueta) + '</span><div class="p" style="font-size:6.2cqw;line-height:1.25;font-weight:900">' + md(s.pregunta) + '</div>' +
      '<div class="opts">' + s.opciones.map(function (o, j) { return '<div><i>' + 'ABCD'[j] + '</i>' + esc(o) + '</div>'; }).join('') + '</div>' +
      '<div class="p" style="font-size:4.8cqw;color:var(--muted)">Escribe tu respuesta en los comentarios.</div><div class="foot" style="margin-top:auto;text-align:left">' + esc(s.pie || 'La respuesta, en la última lámina →') + '</div>';
  } else if (s.tipo === 'chuleta') {
    h = '<span class="tag">' + esc(s.etiqueta || 'Acuérdate así en tu examen') + '</span>' + titulo(s.titulo) +
      (s.formula ? '<div class="chu-f">' + esc(s.formula) + '</div>' : '') +
      '<div class="chu">' + s.pasos.map(function (x, j) { return '<div><i>' + (j + 1) + '</i><span class="st">' + md(x.t) + (x.f ? '<span class="fm">' + md(x.f) + '</span>' : '') + '</span></div>'; }).join('') + '</div>' +
      (s.recuerdo ? '<div class="recuerdo"><span>' + (data.hobby ? data.hobby.icono : '💡') + '</span><span>' + md(s.recuerdo) + '</span></div>' : '') +
      (s.atajo ? '<div class="p" style="font-size:4.4cqw">' + md(s.atajo) + '</div>' : '') +
      '<div class="chu-foot"><span class="chu-save">📌 Guarda esta lámina para repasar</span>' +
      (s.respuesta_reto ? '<span>Respuesta del reto: <b>' + md(s.respuesta_reto) + '</b></span>' : '') +
      '<span>Más temas explicados con lo que te gusta: <b>pasas.mx</b></span></div>';
  } else if (s.tipo === 'cierre') {
    h = '<span class="tag" style="background:#10b981;box-shadow:0 0 2.6cqw #10b981">' + esc(s.etiqueta) + '</span>' +
      '<div class="resp"><b id="respb">' + esc(s.respuesta) + '</b></div><div class="p" style="font-size:5.4cqw;font-weight:900;color:var(--muted)">' + md(s.explicacion) + '</div>' +
      '<div style="height:2cqw"></div>' + titulo(s.titulo) + '<div class="cta">' + md(s.cta) + '</div>';
    if (!data.hobby) { pose = 'celebrando'; pw = 230; px = 850; py = 470; }
  }
  $('body').innerHTML = '<div id="inner" style="display:flex;flex-direction:column;gap:3.4cqw">' + h + '</div>';
  if ($('hobn')) fitLines([$('hobn')], $('body').clientWidth);
  if ($('respb')) fitLines([$('respb')], $('body').clientWidth - (data.hobby ? 0 : 250));   // deja lugar a la Pasita
  // En la portada, el dibujo ocupa todo el espacio que queda
  var fb = document.querySelector('.svgbox.fill');
  if (fb) { var sv = fb.querySelector('svg'); sv.style.height = (fb.clientHeight - 2 * 32) + 'px'; sv.style.width = 'auto'; }
  var tt = document.querySelectorAll('#tt span');
  if (s.tipo === 'portada') tt.forEach(function (x) { x.style.fontSize = '13cqw'; });
  if (tt.length) fitLines([].slice.call(tt), $('body').clientWidth);
  // Si no cabe, se achica todo el contenido parejo (nunca se corta)
  // (se escala el contenido, no la caja: así no se mueve de su lugar)
  var b = $('body'), inn = $('inner'), z = Math.min(1, b.clientHeight / inn.scrollHeight);
  if (z < 1) inn.style.zoom = Math.max(0.68, z);
  inn.style.minHeight = (b.clientHeight / (z < 1 ? Math.max(0.68, z) : 1)) + 'px';   // para que margin-top:auto llegue al fondo
  if (conArte) pose = null;   // la Pasita ya viene en la ilustración
  if (pose) {
    buildPasita($('pasita'), pose, pw);
    var ph = pw * PASITA_VB.h / PASITA_VB.w;
    $('pasita').style.left = (px - pw / 2) + 'px'; $('pasita').style.top = (py - ph) + 'px';
  } else $('pasita').innerHTML = '';
  window.ready = Promise.all([pasitaReady(), conArte ? new Promise(function (ok) { var im = new Image(); im.onload = im.onerror = ok; im.src = s.fondo_img; }) : null]);
  return 0;
};
window.render = function () {};
</script>
