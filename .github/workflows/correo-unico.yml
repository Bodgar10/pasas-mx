# Correo único de soporte (20-oct-2026). Se borra junto con su rama.
# 🔴 Repo público: aquí no va ningún correo ni nombre. La dirección y el
# nombre se leen de Supabase al correr, y la copia oculta es ARCADE_EMAIL_TO.
name: Correo único de soporte
on:
  push:
    branches: [correo-unico]
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enviar
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ARCADE_EMAIL_TO: ${{ secrets.ARCADE_EMAIL_TO }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          USER_ID: a62dea3e-6ea8-456d-8d79-40bddc4f19cc
        run: |
          cat > enviar.mjs <<'JS'
          const { RESEND_API_KEY, ARCADE_EMAIL_TO, NEXT_PUBLIC_SUPABASE_URL: url, SUPABASE_SERVICE_ROLE_KEY: sk, USER_ID } = process.env
          const r = await fetch(`${url}/rest/v1/users?id=eq.${USER_ID}&select=email,full_name,parent_name,parent_email`, { headers: { apikey: sk, Authorization: `Bearer ${sk}` } })
          const [u] = await r.json()
          if (!u?.email) throw new Error('No se encontró la cuenta')
          const primero = (t) => (t || '').trim().split(/\s+/)[0] || ''
          const alumno = primero(u.full_name) || 'tu hijo'
          const tutor = u.parent_email === u.email ? primero(u.parent_name) : ''
          const p = (t) => `<p style="margin:0 0 14px">${t}</p>`
          const html = `<div style="font-family:Arial,sans-serif;font-size:15px;line-height:1.6;color:#1f1f1f;max-width:560px">
          ${p(tutor ? `Hola, ${tutor}:` : 'Hola:')}
          ${p(`Soy Bodgar, uno de los creadores de Pasas. Vi que ayer abriste la cuenta de ${alumno} y quería escribirte yo mismo para darte las gracias por confiar en nosotros.`)}
          ${p(`Pasas lo estamos construyendo mi esposa, que es psicóloga educativa, y yo, y apenas estamos empezando. Por eso tu opinión nos sirve muchísimo: si tienes alguna duda, algo que nos sugieras o, con toda honestidad, si a ${alumno} le está funcionando o no, respóndeme este correo. Lo leo yo y nos ayuda a saber qué mejorar para que de verdad les sirva a los estudiantes.`)}
          ${p('Un recordatorio para que no haya sorpresas: tu prueba gratis dura hasta el 31 de octubre; ese día se cobra $1 del primer mes y después $249 al mes. Puedes cancelar cuando quieras desde tu cuenta.')}
          ${p('Gracias de nuevo,<br>Bodgar<br>Pasas.mx')}
          </div>`
          const res = await fetch('https://api.resend.com/emails', {
            method: 'POST',
            headers: { Authorization: `Bearer ${RESEND_API_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              from: 'Bodgar de Pasas.mx <hola@pasas.mx>',
              to: [u.email],
              bcc: ARCADE_EMAIL_TO.split(',').map((s) => s.trim()),
              reply_to: 'hola@pasas.mx',
              subject: 'Gracias por confiar en Pasas',
              html,
            }),
          })
          const body = await res.json().catch(() => ({}))
          if (!res.ok) throw new Error(`Resend respondió ${res.status}: ${body?.message ?? ''}`)
          console.log('Enviado. id de Resend:', body.id)
          JS
          node enviar.mjs
