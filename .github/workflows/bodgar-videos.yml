# Video diario de bodgar.dev (plataformas en español, apps en inglés), SIN voz, por correo.
# Lee video/data/bodgar/AAAA-MM-DD.json (fecha de hoy en México) y su plantilla en video/templates/bodgar/.
# Corre solo de lunes a viernes ~06:47 hora de México; se publica a las 12:30 PM.
# A mano: Actions → "Videos de bodgar.dev" → Run workflow (fecha opcional).
# Guía: video/BODGAR.md
name: Videos de bodgar.dev

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'AAAA-MM-DD (vacío = hoy en hora de México)'
        type: string
        default: ''
      data:
        description: 'Video extra fuera del calendario: ruta del JSON dentro de video/ (ej. data/bodgar/extra/idiomas-tope.json). Vacío = el del día'
        type: string
        default: ''
      enviar:
        description: 'Mandar el correo'
        type: boolean
        default: true
  schedule:
    # Minutos "raros" a propósito: GitHub retrasa los horarios en punto.
    # GitHub a veces se salta una corrida programada (pasó el martes 20 de octubre),
    # así que hay dos respaldos. Si ya salió el correo del día, los respaldos no hacen nada.
    - cron: '47 12 * * 1-5'   # ~06:47 hora de México, lunes a viernes
    - cron: '23 13 * * 1-5'   # respaldo ~07:23
    - cron: '53 13 * * 1-5'   # respaldo ~07:53

concurrency:
  group: bodgar-videos
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: video
    steps:
      # Solo en corridas programadas: si hoy (hora de México) ya hubo una corrida exitosa, no repite el correo.
      - name: ¿Ya salió el correo de hoy?
        id: hoy
        if: github.event_name == 'schedule'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOY=$(TZ=America/Mexico_City date +%F)
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/bodgar-videos.yml/runs?status=success&per_page=30" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select((.created_at | fromdateiso8601 - 21600 | strftime(\"%Y-%m-%d\")) == \"$HOY\")] | length")
          echo "Corridas exitosas hoy ($HOY): $N"
          if [ "$N" -gt 0 ]; then echo "listo=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.hoy.outputs.listo != '1'

      - uses: actions/setup-node@v4
        if: steps.hoy.outputs.listo != '1'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Instalar dependencias
        if: steps.hoy.outputs.listo != '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generar y enviar
        if: steps.hoy.outputs.listo != '1'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BODGAR_EMAIL_TO: ${{ secrets.BODGAR_EMAIL_TO }}
          ARCADE_EMAIL_TO: ${{ secrets.ARCADE_EMAIL_TO }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.fecha }}" ]; then ARGS="$ARGS --fecha ${{ inputs.fecha }}"; fi
          if [ -n "${{ inputs.data }}" ]; then ARGS="$ARGS --data ${{ inputs.data }}"; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.enviar }}" = "true" ]; then ARGS="$ARGS --enviar"; fi
          node src/bodgar.mjs $ARGS

      # Respaldo: si el correo falla, el video queda descargable en la corrida
      - name: Guardar archivos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bodgar-${{ github.run_id }}
          path: video/salida/bodgar/
          retention-days: 7
          if-no-files-found: ignore
